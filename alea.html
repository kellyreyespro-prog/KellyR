<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22112e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ALÉA"><meta name="description" content="ALÉA, tu aplicación personal de autocuidado y bienestar."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./alea-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./alea-icon.svg"><title>ALÉA | Tu espacio de autocuidado</title>
<style>*{box-sizing:border-box}body{margin:0;background:#160b20;color:#fff;font-family:system-ui,sans-serif}.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#21102f}.bar strong{font-size:18px;letter-spacing:.12em;color:#e3c5ff}.bar button{background:#8f56c4;color:white;border:0;border-radius:10px;padding:8px 13px;font-weight:600}.bar button[hidden]{display:none}iframe{display:block;border:0;width:100%;height:calc(100dvh - 44px)}#tip{position:fixed;z-index:3;bottom:16px;left:16px;right:16px;padding:14px;border-radius:15px;background:#251535;color:#fff;box-shadow:0 12px 36px #0007}#tip[hidden]{display:none}#tip button{float:right;background:transparent;border:0;color:white;font-size:20px}</style></head><body><header class="bar"><strong>ALÉA ✦</strong><button id="install" hidden>Instalar ALÉA</button></header><iframe src="./index.html" title="ALÉA, aplicación de autocuidado" loading="eager" allow="clipboard-write"></iframe><div id="tip" hidden><button aria-label="Cerrar mensaje" onclick="this.parentElement.hidden=true">×</button><span id="tiptext"></span></div><script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}
let pending;const btn=document.querySelector('#install');addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;btn.hidden=false});btn.addEventListener('click',async()=>{if(pending){await pending.prompt();pending=null;btn.hidden=true;}else{showHelp()}});addEventListener('appinstalled',()=>{btn.hidden=true;pending=null});
function showHelp(){const apple=/iPad|iPhone|iPod/.test(navigator.userAgent);document.querySelector('#tiptext').textContent=apple?'En Safari, toca Compartir y luego «Añadir a pantalla de inicio».':'En el menú de tu navegador busca «Instalar aplicación» o «Añadir a pantalla de inicio».';document.querySelector('#tip').hidden=false}
if(/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)&&!matchMedia('(display-mode: standalone)').matches){btn.hidden=false}
</script></body></html>
